<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plakat med QR</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <style>
    :root { --volt: #d4ff00; }
    * { box-sizing: border-box; margin: 0; }
    body { background: #0a0a0a; color: #f5f5f2; font-family: Inter, sans-serif; padding: 24px 16px; }
    .ark { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 28px; max-width: 980px; margin: 0 auto; align-items: center; }
    .plakat { width: 100%; height: auto; display: block; border-radius: 6px; }
    .qr-boks { background: #fff; color: #0a0a0a; border-radius: 20px; padding: 22px; text-align: center; }
    .qr-boks h1 { font-family: "Archivo Black", sans-serif; font-size: 26px; line-height: 1; text-transform: uppercase; }
    .qr-boks p { font-size: 14px; margin-top: 10px; line-height: 1.4; }
    #qr svg { width: 100%; height: auto; margin-top: 14px; }
    .trin { text-align: left; margin-top: 14px; padding-left: 18px; font-size: 14px; line-height: 1.6; }
    .url { font-size: 11px; color: #666; margin-top: 10px; word-break: break-all; }
    @media (max-width: 720px) { .ark { grid-template-columns: 1fr; } }
    @media print {
      body { background: #fff; padding: 0; }
      .ark { gap: 16px; }
      .qr-boks { border: 2px solid #0a0a0a; }
    }
  </style>
</head>
<body>
  <div class="ark">
    <img class="plakat" src="assets/plakat.png" alt="Kampagneplakat – Step Into AR">
    <div class="qr-boks">
      <h1>Scan &amp; step into AR</h1>
      <p>Prøv oplevelsen på din egen telefon.</p>
      <div id="qr"></div>
      <ol class="trin">
        <li>Scan QR-koden</li>
        <li>Tryk <b>Start AR-oplevelse</b> og tillad kamera</li>
        <li>Peg kameraet mod plakaten</li>
        <li>Swipe for at skifte sko</li>
      </ol>
      <p class="url" id="url"></p>
    </div>
  </div>
  <script>
    // QR'en peger på ?url=… hvis den er sat, ellers på index.html i samme mappe som denne side
    const param = new URLSearchParams(location.search).get("url");
    const maal = param || new URL("index.html", location.href).href;
    const qr = qrcode(0, "M");
    qr.addData(maal);
    qr.make();
    document.getElementById("qr").innerHTML = qr.createSvgTag({ cellSize: 8, margin: 2, scalable: true });
    document.getElementById("url").textContent = maal;
  </script>
</body>
</html>
