<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <title>Plakat-generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #222; color: #eee; font: 14px Inter, sans-serif; display: grid; gap: 12px; padding: 16px; }
    canvas#plakat { width: 360px; height: auto; box-shadow: 0 10px 40px #000; }
    button { font: 700 14px Inter, sans-serif; padding: 10px 14px; border-radius: 8px; border: 0; cursor: pointer; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <p>Genererer kampagneplakaten (AR-target) og kompilerer den til MindAR. Kør <code>lavAlt()</code> eller tryk på knappen.</p>
  <div><button id="koer">Lav plakat + .mind</button> <span id="status"></span></div>
  <canvas id="plakat" width="1200" height="1600"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js" type="module"></script>
  <script type="module">
    import * as THREE from "three";
    import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
    import { BRAND, SKO, lavSko } from "../js/sko.js";

    const W = 1200, H = 1600;
    const VOLT = "#d4ff00";
    const status = (t) => (document.getElementById("status").textContent = t);

    // Deterministisk tilfældighed, så plakaten bliver ens hver gang
    let seed = 7;
    const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

    async function renderSko() {
      const r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
      r.setSize(1150, 760);
      r.outputColorSpace = THREE.SRGBColorSpace;
      r.toneMapping = THREE.ACESFilmicToneMapping;
      const sc = new THREE.Scene();
      sc.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
      const sol = new THREE.DirectionalLight(0xffffff, 2);
      sol.position.set(1, 2, 2);
      sc.add(sol);
      const kant = new THREE.DirectionalLight(0xd4ff00, 1.2);
      kant.position.set(-2, 0.5, -1);
      sc.add(kant);
      const sko = await lavSko(SKO[0]);
      sko.rotation.set(0.15, -0.55, 0.12);
      sc.add(sko);
      const cam = new THREE.PerspectiveCamera(30, 1150 / 760, 0.01, 20);
      cam.position.set(0, 0.45, 2.2);
      cam.lookAt(0, 0.2, 0);
      r.render(sc, cam);
      return r.domElement;
    }

    // Samme typografi som siden: Archivo (bred, kraftig) + Geist
    const display = (stoerrelse, kursiv = false, vaegt = 900) =>
      `${kursiv ? "italic " : ""}${vaegt} ${stoerrelse}px Archivo`;
    const tekst = (stoerrelse, vaegt = 500) => `${vaegt} ${stoerrelse}px Geist`;

    async function tegnPlakat() {
      await Promise.all([
        document.fonts.load(display(200)), document.fonts.load(display(200, true)),
        document.fonts.load(tekst(28)), document.fonts.load(tekst(28, 600)),
      ]);
      const c = document.getElementById("plakat");
      const g = c.getContext("2d");
      seed = 7;

      // Baggrund
      g.fillStyle = "#0b0b0c";
      g.fillRect(0, 0, W, H);

      // Volt-bånd på skrå bag skoen
      g.save();
      g.translate(W / 2, 1000);
      g.rotate(-0.3);
      g.fillStyle = VOLT;
      g.fillRect(-1000, -160, 2000, 320);
      g.fillStyle = "#101300";
      g.fontStretch = "expanded";
      g.font = display(40, true, 800);
      const baandTekst = "AIR PULSE   STEP INTO AR   ";
      const bredde = g.measureText(baandTekst).width;
      for (let x = -1000; x < 1000; x += bredde) g.fillText(baandTekst, x, 140);
      g.restore();

      // Overskrift
      g.fontStretch = "semi-expanded";
      g.fillStyle = "#f5f5f0";
      g.font = display(205);
      g.fillText("STEP", 56, 360);
      g.fillText("INTO", 56, 545);
      g.fillStyle = VOLT;
      g.font = display(205, true);
      g.fillText("AR.", 56, 730);

      // Ordmærke + produktnavn
      g.fontStretch = "ultra-expanded";
      g.fillStyle = "#f5f5f0";
      g.font = display(44, true);
      g.fillText(BRAND.navn, 60, 120);
      g.fontStretch = "normal";
      g.textAlign = "right";
      g.fillStyle = "rgba(245,245,240,0.62)";
      g.font = tekst(28);
      g.fillText("Air Pulse", W - 60, 116);
      g.textAlign = "left";

      // Skoen
      const sko = await renderSko();
      g.save();
      g.shadowColor = "rgba(0,0,0,0.6)";
      g.shadowBlur = 40;
      g.shadowOffsetY = 30;
      g.drawImage(sko, 25, 640);
      g.restore();

      // Farvefelter for kollektionen
      const farver = SKO.map((s) => "#" + s.farver.overdel.toString(16).padStart(6, "0"));
      farver.forEach((f, i) => {
        g.beginPath();
        g.arc(84 + i * 68, 1436, 24, 0, Math.PI * 2);
        g.fillStyle = f;
        g.fill();
        g.lineWidth = 3;
        g.strokeStyle = "rgba(255,255,255,0.25)";
        g.stroke();
      });

      // Bundtekst
      g.fillStyle = "#f5f5f0";
      g.font = tekst(34, 600);
      g.fillText("Scan, og se skoen på dit bord.", 60, 1370);
      g.fillStyle = "rgba(245,245,240,0.4)";
      g.font = tekst(18);
      g.fillText(BRAND.disclaimer, 60, 1548);

      // Filmkorn over det hele: giver plakaten tekstur og kameraet flere genkendelsespunkter
      const pix = g.getImageData(0, 0, W, H);
      const d = pix.data;
      for (let i = 0; i < d.length; i += 4) {
        const n = (rnd() - 0.5) * 34;
        d[i] += n; d[i + 1] += n; d[i + 2] += n;
      }
      g.putImageData(pix, 0, 0);
      return c;
    }

    async function gem(navn, blob) {
      const svar = await fetch("/gem/" + navn, { method: "PUT", body: blob });
      if (!svar.ok) throw new Error("Kunne ikke gemme " + navn);
    }

    async function lavAlt() {
      status("Tegner plakat…");
      const c = await tegnPlakat();
      const png = await new Promise((ok) => c.toBlob(ok, "image/png"));
      await gem("plakat.png", png);

      status("Kompilerer AR-target…");
      const img = new Image();
      img.src = URL.createObjectURL(png);
      await img.decode();
      const compiler = new window.MINDAR.IMAGE.Compiler();
      await compiler.compileImageTargets([img], (p) => status("Kompilerer AR-target… " + p.toFixed(0) + "%"));
      const data = await compiler.exportData();
      await gem("plakat.mind", new Blob([data]));
      status("Færdig: assets/plakat.png + assets/plakat.mind");
      return "ok";
    }

    window.tegnPlakat = tegnPlakat;
    window.lavAlt = lavAlt;
    document.getElementById("koer").onclick = lavAlt;
    tegnPlakat();
  </script>
</body>
</html>
